<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multiple Timers App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Multiple Timers App</h2>
        
        <div class="input-box">
            <label>Set Time :</label>
            <input type="number" id="hours" placeholder="hh">
            <span>:</span>
            <input type="number" id="minutes" placeholder="mm">
            <span>:</span>
            <input type="number" id="seconds" placeholder="ss">
            <button onclick="startTimer()">Set</button>
        </div>

        <div class="current-timers">
            Current Timers
        </div>

        <div id="timerList">
            <p id="noTimer">
                You have no timers currently!
            </p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
